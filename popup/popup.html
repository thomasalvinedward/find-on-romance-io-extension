<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Find on Romance.io</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1>Find on Romance.io</h1>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </header>

      <section class="section" aria-labelledby="buttons-heading">
        <h2 id="buttons-heading">Buttons</h2>
        <div id="button-settings" class="setting-list"></div>
      </section>

      <section class="section" aria-labelledby="right-click-heading">
        <h2 id="right-click-heading">Right-click Search</h2>
        <label class="toggle-row">
          <span class="toggle-label">Selected text</span>
          <input type="checkbox" data-setting="contextMenu">
          <span class="switch" aria-hidden="true"></span>
        </label>
      </section>

      <p class="note">Changes apply to open book pages automatically.</p>
    </main>

    <script src="../shared/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
