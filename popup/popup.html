<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Find on Romance.io</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1>
          Find on Romance.io
          <span id="version" class="version"></span>
        </h1>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </header>

      <section class="section" aria-labelledby="options-heading">
        <h2 id="options-heading">Options</h2>
        <label class="toggle-row">
          <span class="toggle-label">Auto-open best match</span>
          <input type="checkbox" data-setting="autoOpenBestMatch">
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="toggle-row">
          <span class="toggle-label">Right-click search</span>
          <input type="checkbox" data-setting="contextMenu">
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="toggle-row">
          <span class="toggle-label">Search button</span>
          <input type="checkbox" data-setting="searchButton">
          <span class="switch" aria-hidden="true"></span>
        </label>
      </section>

      <section id="site-options" class="site-options" aria-label="Search button sites">
        <div id="button-settings" class="site-grid"></div>
      </section>

      <footer class="footer">
        <p class="footer-links">
          <a href="https://github.com/thomasalvinedward/find-on-romance-io-extension" target="_blank" rel="noreferrer">GitHub</a>
          <span aria-hidden="true">·</span>
          <a href="https://github.com/thomasalvinedward/find-on-romance-io-extension/issues/new?template=bug_report.yml" target="_blank" rel="noreferrer">Report a bug</a>
          <span aria-hidden="true">·</span>
          <a href="https://github.com/thomasalvinedward/find-on-romance-io-extension/issues/new?template=feature_request.yml" target="_blank" rel="noreferrer">Request a feature</a>
        </p>
        <p class="support-link">
          <a href="https://ko-fi.com/thomasalvinedward" target="_blank" rel="noreferrer">Support &hearts;</a>
        </p>
      </footer>
    </main>

    <script src="../shared/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
